# DeepSeek Harness Docker Compose
# ================================
# Quick start:
#   docker compose up -d
#   # Open http://localhost:3080, configure API keys in Web UI
#
# Environment variables:
#   DSH_PORT            - DSH internal listen on 127.0.0.1 (default: 3079)
#   PROXY_PORT          - Caddy proxy external port (default: 3080)
#   PROXY_USERNAME      - Basic Auth username (optional)
#   PROXY_PASSWORD      - Basic Auth password (optional)
#   DSH_TRUSTED_HOSTS   - LAN IP/domain of this deployment (for /api via proxy)
#   DSH_UPDATE_ON_START - set "true" to auto-update DSH on start

version: "3.9"

services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepseek-harness:latest
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-3080}:${PROXY_PORT:-3080}"
    environment:
      - DSH_PERMISSION_MODE=danger-full-access
      - DSH_HOST=127.0.0.1
      - DSH_PORT=${DSH_PORT:-3079}
      - PROXY_PORT=${PROXY_PORT:-3080}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
      - DSH_UPDATE_ON_START=${DSH_UPDATE_ON_START:-false}
      - DSH_TELEMETRY_MODE=${DSH_TELEMETRY_MODE:-DISABLED}
    volumes:
      - dsh_data:/opt/dsh-home
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${DSH_PORT:-3079}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  dsh_data:
    driver: local
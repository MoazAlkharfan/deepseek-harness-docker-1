# GitHub Actions: Build and Push DeepSeek Harness Docker Image
# ============================================================
# Triggers:
#   - Push to main/master (Docker-related files only)
#   - Daily schedule (midnight UTC) — fresh DSH version
#   - Manual workflow_dispatch
#
# Pushes to:
#   - GHCR:       ghcr.io/<owner>/deepseek-harness  (always)
#   - Docker Hub: docker.io/<user>/deepseek-harness  (if DOCKERHUB_USERNAME/TOKEN set)

name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'Caddyfile.template'
      - 'entrypoint.sh'
      - '.github/workflows/docker-build.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH version to install (e.g. latest, 0.1.0-rc.7)'
        required: false
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Check Docker Hub availability ---
      - name: Check Docker Hub secrets
        id: dockerhub
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets not set — pushing only to GHCR"
          fi
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- GHCR login (always) ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Docker Hub login (conditional) ---
      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Build images list ---
      - name: Build images list
        id: images
        run: |
          IMAGES="ghcr.io/${{ github.repository_owner }}/deepseek-harness"
          if [ "${{ steps.dockerhub.outputs.available }}" = "true" ]; then
            IMAGES="${{ secrets.DOCKERHUB_USERNAME }}/deepseek-harness"$'\n'"$IMAGES"
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # --- Metadata ---
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=${{ inputs.dsh_version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # --- Build and Push ---
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DSH_VERSION=${{ inputs.dsh_version || 'latest' }}
            CACHE_BUST=${{ github.event_name == 'schedule' && github.run_id || '0' }}
# GitHub Actions: Build, Smoke-Test and Push DeepSeek Harness Docker Image
# ========================================================================
# Triggers:
#   - Push to main/master (Docker-related files only)
#   - Daily schedule (midnight UTC) — fresh DSH version
#   - Manual workflow_dispatch (with optional debug + DSH version input)
#
# Pushes to:
#   - GHCR:       ghcr.io/<owner>/deepseek-harness  (always)
#   - Docker Hub: docker.io/<user>/deepseek-harness  (if DOCKERHUB_USERNAME/TOKEN set)
#
# After building, the image is started inside the runner and probed with curl;
# if the page does not come up, container logs are dumped and uploaded as an
# artifact. The Dockerfile + related files are uploaded as an artifact too.

name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'Caddyfile.template'
      - 'entrypoint.sh'
      - '.github/workflows/docker-build.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH version to install (e.g. latest, 0.1.0-rc.7)'
        required: false
        default: 'latest'
      debug:
        description: 'Debug mode — verbose curl + always keep full logs artifact'
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Check Docker Hub availability ---
      - name: Check Docker Hub secrets
        id: dockerhub
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets not set — pushing only to GHCR"
          fi
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- GHCR login (always) ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Docker Hub login (conditional) ---
      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Build images list ---
      - name: Build images list
        id: images
        run: |
          IMAGES="ghcr.io/${{ github.repository_owner }}/deepseek-harness"
          if [ "${{ steps.dockerhub.outputs.available }}" = "true" ]; then
            IMAGES="${{ secrets.DOCKERHUB_USERNAME }}/deepseek-harness"$'\n'"$IMAGES"
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # --- Metadata ---
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=${{ inputs.dsh_version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # --- Build and Push (also load into local daemon for smoke test) ---
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DSH_VERSION=${{ inputs.dsh_version || 'latest' }}
            CACHE_BUST=${{ github.event_name == 'schedule' && github.run_id || '0' }}

      # ================= SMOKE TEST (DEBUG) =================
      # Run the just-built image, curl the proxy (:3080) and DSH (:3079).
      # Failure -> container logs dumped and uploaded as artifact.
      - name: Smoke test — run container and curl
        id: smoke
        env:
          DEBUG_MODE: ${{ inputs.debug == true && 'true' || 'false' }}
        run: |
          set -x
          DEBUG="${DEBUG_MODE:-false}"
          docker info > /dev/null 2>&1 || { echo "ERROR: docker daemon unavailable"; exit 1; }

          # Pick a GHCR :latest tag from metadata output (lowercase, local-loaded)
          SMOKE_IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | tr ' ' '\n' | grep '^ghcr.io/' | grep ':latest$' | head -1)
          if [ -z "$SMOKE_IMAGE" ]; then
            SMOKE_IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | tr ' ' '\n' | grep '^ghcr.io/' | head -1)
          fi
          echo "SMOKE_IMAGE=$SMOKE_IMAGE"
          echo "smoke_image=${SMOKE_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "=== Starting container from ${SMOKE_IMAGE} ==="
          docker run -d --name dsh-smoke \
            -e DSH_PERMISSION_MODE=danger-full-access \
            -e DSH_HOST=127.0.0.1 \
            -e DSH_PORT=3079 \
            -e PROXY_PORT=3080 \
            -p 3080:3080 \
            -p 3079:3079 \
            "${SMOKE_IMAGE}"
          echo "container_id=$(docker ps -q --filter name=dsh-smoke)" | tee -a "$GITHUB_OUTPUT"

          # Wait for the page to come up (allow up to 120s)
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:3080/ 2>/dev/null || echo "000")
            if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "304" ]; then
              echo "PROXY_READY=true (HTTP $code after ${i}x2s)" | tee -a "$GITHUB_OUTPUT"
              ready=1
              break
            fi
            sleep 2
          done

          curl_flags="-sS -i --max-time 5"
          if [ "$DEBUG" = "true" ]; then curl_flags="-v --max-time 5 -sS"; fi

          echo "=== curl http://127.0.0.1:3080/ (proxy) ==="
          curl $curl_flags http://127.0.0.1:3080/ > proxy-response.txt 2>&1 || true
          head -40 proxy-response.txt || true

          echo "=== curl http://127.0.0.1:3079/ (DSH direct) ==="
          curl $curl_flags http://127.0.0.1:3079/ > dsh-response.txt 2>&1 || true
          head -40 dsh-response.txt || true

          if [ "$DEBUG" = "true" ]; then
            echo "=== docker inspect (debug) ==="
            docker inspect dsh-smoke | head -60 || true
          fi

          # Verify it looks like a web page
          page_ok=0
          if grep -qiE "<html|<!doctype html|deepseek|title" proxy-response.txt 2>/dev/null; then
            page_ok=1
            echo "PAGE_OK=true" >> "$GITHUB_OUTPUT"
          fi

          # Verify the crypto.randomUUID polyfill was injected into index.html
          polyfill_ok=0
          if grep -q "randomUUID polyfill" proxy-response.txt 2>/dev/null; then
            polyfill_ok=1
            echo "POLYFILL_OK=true" >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: crypto.randomUUID polyfill NOT found in served index.html"
          fi

          echo "=== docker ps ==="
          docker ps --filter name=dsh-smoke

          if [ "$ready" != "1" ] || [ "$page_ok" != "1" ]; then
            echo "::error::Smoke test FAILED — page did not come up (ready=$ready page_ok=$page_ok)"
            docker logs dsh-smoke 2>&1 | tail -300 | tee full-container.log
            exit 1
          fi

          echo "::notice::Smoke test PASSED — page reachable through Caddy proxy (polyfill_ok=$polyfill_ok)"

      # --- Always keep container logs for debugging ---
      - name: Dump container logs (debug)
        if: ${{ always() && (steps.smoke.outcome == 'failure' || inputs.debug == true) }}
        run: |
          docker logs dsh-smoke > full-container.log 2>&1 || true
          echo "--- last 100 lines ---"
          tail -100 full-container.log || true

      # --- Clean up test container ---
      - name: Stop test container
        if: always()
        run: |
          docker rm -f dsh-smoke > /dev/null 2>&1 || true

      # --- Upload error logs (only when smoke test failed) ---
      - name: Upload error logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-error-logs
          path: |
            full-container.log
            proxy-response.txt
            dsh-response.txt
          if-no-files-found: ignore

      # --- Upload Dockerfile + build files (always) ---
      - name: Upload Dockerfile as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-files
          path: |
            Dockerfile
            Caddyfile.template
            entrypoint.sh
            docker-compose.yml
          if-no-files-found: ignore
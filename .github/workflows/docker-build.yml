# GitHub Actions: Build and Push DeepSeek Harness Docker Image
# ============================================================
# Triggers:
#   - Push to main/master branch
#   - Daily schedule (midnight UTC)
#   - Manual workflow dispatch
#
# Pushes to:
#   - Docker Hub: docker.io/<secrets.DOCKERHUB_USERNAME>/deepseek-harness
#   - GHCR:       ghcr.io/<github.repository_owner>/deepseek-harness

name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'Caddyfile.template'
      - 'entrypoint.sh'
      - '.github/workflows/docker-build.yml'
  schedule:
    # Daily at 00:00 UTC — picks up latest DSH releases
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH version to install (e.g. 0.1.0-rc.7, or "latest")'
        required: false
        default: 'latest'

env:
  REGISTRY_IMAGE_DH: ${{ secrets.DOCKERHUB_USERNAME }}/deepseek-harness
  REGISTRY_IMAGE_GHCR: ghcr.io/${{ github.repository_owner }}/deepseek-harness

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Docker Hub login ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- GHCR login ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Metadata ---
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_IMAGE_DH }}
            ${{ env.REGISTRY_IMAGE_GHCR }}
          tags: |
            # Branch-based tags
            type=ref,event=branch
            # Semver tags from git tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Latest tag
            type=raw,value=latest,enable={{is_default_branch}}
            # Date-based tag for scheduled builds
            type=schedule,pattern={{date 'YYYYMMDD'}}
            # Manual dispatch version tag
            type=raw,value=${{ inputs.dsh_version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # --- Build and Push ---
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DSH_VERSION=${{ inputs.dsh_version || 'latest' }}
            CACHE_BUST=${{ github.run_id }}